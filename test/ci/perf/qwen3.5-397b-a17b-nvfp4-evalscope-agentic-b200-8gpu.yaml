api_version: ci.tokenspeed.io/v1
name: perf-pr1854-qwen-ab-b200-8gpu
type: perf
workflow_stage: model-test
triggers:
  - manual
runner:
  labels:
    - b200-8gpu
env:
  CI: "true"
install:
  - bash test/ci_system/install_deps.sh
perf:
  install:
    - python3 -m uv venv --seed --clear /tmp/evalscope-perf && python3 -m uv pip install --python /tmp/evalscope-perf/bin/python 'evalscope[perf]'
    - >-
      /tmp/evalscope-perf/bin/python -c
      'from huggingface_hub import hf_hub_download;
      hf_hub_download(repo_id="lightseekorg/agentic-dataset",
      filename="agentic_dataset.json", repo_type="dataset",
      revision="2779acd48a05c211f2f82eee71bdbdf688d984ca", local_dir="/tmp")'
      && test -s /tmp/agentic_dataset.json
  command: python3 test/ci_system/pr1854_qwen_ab.py
report:
  github_step_summary: true
# Diagnostic branch only. Each nested round retains the original CI thresholds.
